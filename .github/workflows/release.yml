name: Release installers

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Resolve release version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Restore, build, and test
        run: |
          dotnet restore BandHub.FirmwareUpdate.sln
          dotnet build BandHub.FirmwareUpdate.sln -c Release --no-restore -p:Version="$VERSION"
          dotnet test test/BandHub.FirmwareUpdate.Tests -c Release --no-build
          python3 test/test_packaging_icons.py
      - name: Build Linux installer
        run: |
          dotnet publish src/BandHub.FirmwareUpdate -c Release \
            -r linux-x64 --self-contained true -p:Version="$VERSION" \
            -o .tmp/updater-linux
          packaging/linux/build-deb.sh \
            "$VERSION" amd64 .tmp/updater-linux .tmp/installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-installer
          path: .tmp/installers/*.deb
          if-no-files-found: error

  windows:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gtk3
      - name: Resolve release version
        shell: pwsh
        run: '"VERSION=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_ENV'
      - name: Restore, build, and test
        run: |
          dotnet restore BandHub.FirmwareUpdate.sln
          dotnet build BandHub.FirmwareUpdate.sln -c Release --no-restore -p:Version=$env:VERSION
          dotnet test test/BandHub.FirmwareUpdate.Tests -c Release --no-build
      - name: Build Windows installer
        shell: pwsh
        run: |
          dotnet publish src/BandHub.FirmwareUpdate -c Release `
            -r win-x64 --self-contained true -p:Version=$env:VERSION `
            -o .tmp/updater-windows
          dotnet tool install --global wix --version 5.0.2
          ./packaging/windows/build-msi.ps1 `
            -Version $env:VERSION `
            -PublishDirectory .tmp/updater-windows `
            -GtkRuntimeDirectory "${{ steps.msys2.outputs.msys2-location }}\mingw64" `
            -OutputDirectory .tmp/installers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: .tmp/installers/*.msi
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.deb *.msi > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" dist/*
          --repo "${{ github.repository }}" --clobber
