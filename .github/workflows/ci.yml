name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BandHub.FirmwareUpdate.sln
      - name: Build
        run: dotnet build BandHub.FirmwareUpdate.sln -c Release --no-restore
      - name: Test
        run: dotnet test test/BandHub.FirmwareUpdate.Tests -c Release --no-build
      - name: Validate icon integration
        run: python3 test/test_packaging_icons.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore BandHub.FirmwareUpdate.sln
      - name: Build and test
        run: |
          dotnet build BandHub.FirmwareUpdate.sln -c Release --no-restore
          dotnet test test/BandHub.FirmwareUpdate.Tests -c Release --no-build
